<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hex Shield Background -->
  <polygon points="32,4 58,16 58,44 32,60 6,44 6,16" fill="#0B1120" stroke="url(#cyberGrad)" stroke-width="2.5" />
  <!-- Inner Cyber Core -->
  <polygon points="32,14 50,23 50,41 32,50 14,41 14,23" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7" />
  <!-- Center N Shield Emblem -->
  <path d="M22 42V22L42 42V22" stroke="url(#cyberGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Orbit Nodes -->
  <circle cx="32" cy="14" r="2.5" fill="#00F0FF" />
  <circle cx="50" cy="41" r="2.5" fill="#8B5CF6" />
  <circle cx="14" cy="41" r="2.5" fill="#0066FF" />
</svg>